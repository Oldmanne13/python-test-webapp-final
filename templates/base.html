<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Python-progression</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Python-progression</h1>
        <nav>
            {% if session.get('role') == 'student' %}
                <a href="{{ url_for('student') }}">Mit dashboard</a>
                <a href="{{ url_for('teacher_entry') }}">Lærerlogin</a>
                <a href="{{ url_for('logout') }}">Log ud</a>
            {% elif session.get('role') == 'teacher' %}
                <a href="{{ url_for('teacher') }}">Lærerdashboard</a>
                <a href="{{ url_for('manage_students') }}">Elevliste</a>
                <a href="{{ url_for('export_csv') }}">Eksporter detaljeret CSV</a>
                <a href="{{ url_for('logout') }}">Log ud</a>
            {% else %}
                <a href="{{ url_for('index') }}">Elevlogin</a>
                <a href="{{ url_for('teacher_login') }}">Lærerlogin</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block body %}{% endblock %}
    </main>
</body>
</html>
