{% extends 'base.html' %}
{% block body %}
<div class="card">
    <h2>Elev-login</h2>
    <p>Brug det elev-ID, du har fået af læreren.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <label for="student_id">Elev-ID</label>
        <input id="student_id" name="student_id" placeholder="fx 1X07" required autofocus>
        <button type="submit">Fortsæt som elev</button>
    </form>
</div>

<div class="card">
    <h2>Lærer</h2>
    <p>Lærerdashboardet kræver adgangskode.</p>
    <a class="button" href="{{ url_for('teacher_login') }}">Lærerlogin</a>
</div>
{% endblock %}
